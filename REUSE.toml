version = 1

# Later annotations override earlier ones.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 The Seafoam Kitten ASMR Community"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = ["content/**", "community/**", "README.md"]
SPDX-FileCopyrightText = "2026 The Seafoam Kitten ASMR Community"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated pages mix material from YouTube with the work of the community.
[[annotations]]
path = ["content/videos/*.md", "content/shorts/*.md", "content/streams/*.md", "content/playlists/*.md"]
SPDX-FileCopyrightText = ["Seafoam Kitten ASMR", "2026 The Seafoam Kitten ASMR Community"]
SPDX-License-Identifier = "LicenseRef-SeafoamKitten AND CC-BY-4.0"

# Collab pages are about videos of other channels that Seafoam Kitten takes part in.
[[annotations]]
path = "content/collabs/*.md"
SPDX-FileCopyrightText = ["The creators of the videos", "2026 The Seafoam Kitten ASMR Community"]
SPDX-License-Identifier = "LicenseRef-YouTubeCreators AND CC-BY-4.0"

# Transcripts write down the words of the videos: of Seafoam Kitten ASMR, or of the other creators of collabs.
[[annotations]]
path = "community/videos/*.vtt"
SPDX-FileCopyrightText = ["Seafoam Kitten ASMR", "The creators of the videos", "2026 The Seafoam Kitten ASMR Community"]
SPDX-License-Identifier = "LicenseRef-SeafoamKitten AND LicenseRef-YouTubeCreators AND CC-BY-4.0"

[[annotations]]
path = "static/thumbs/**"
SPDX-FileCopyrightText = "Seafoam Kitten ASMR"
SPDX-License-Identifier = "LicenseRef-SeafoamKitten"

# Covers of the releases of Seafoam Kitten ASMR on Spotify and Apple Music, and of the podcast episodes.
[[annotations]]
path = "static/covers/**"
SPDX-FileCopyrightText = "Seafoam Kitten ASMR"
SPDX-License-Identifier = "LicenseRef-SeafoamKitten"

# Thumbnails of videos by other channels, from playlists such as Favorite ASMR, and of collabs.
[[annotations]]
path = "static/thumbs/others/**"
SPDX-FileCopyrightText = "The creators of the videos"
SPDX-License-Identifier = "LicenseRef-YouTubeCreators"

[[annotations]]
path = ["content/videos/_index.md", "content/shorts/_index.md", "content/streams/_index.md", "content/playlists/_index.md", "content/collabs/_index.md"]
SPDX-FileCopyrightText = "2026 The Seafoam Kitten ASMR Community"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "static/vendor/lite-youtube-embed/**"
SPDX-FileCopyrightText = "2019 Paul Irish"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "static/vendor/aria-practices/**"
SPDX-FileCopyrightText = "World Wide Web Consortium"
SPDX-License-Identifier = "W3C-20150513"
