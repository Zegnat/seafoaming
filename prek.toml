# Vendored files stay as their authors wrote them.
exclude = "^(static/vendor|icons)/"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.5"
hooks = [
  { id = "rumdl-fmt" },
  { id = "rumdl-check" },
]

[[repos]]
repo = "https://github.com/fsfe/reuse-tool"
rev = "v6.2.0"
hooks = [{ id = "reuse" }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"
hooks = [{ id = "zizmor", args = ["--offline"] }]

[[repos]]
repo = "local"
hooks = [
  # Every action in a workflow must be pinned to a full commit; --no-api checks that without the network.
  { id = "pinact", name = "pinact", entry = "pinact run --fix=false --no-api", language = "system", files = "^\\.github/workflows/" },
  { id = "deno-fmt", name = "deno fmt", entry = "deno fmt", language = "system", types = ["ts"] },
  { id = "deno-lint", name = "deno lint", entry = "deno lint", language = "system", types = ["ts"] },
]
